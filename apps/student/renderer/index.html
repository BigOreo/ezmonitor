<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EzMonitor Student</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>EzMonitor &mdash; Student</h1>
    </header>

    <main>
      <section id="connect-panel">
        <label>
          Your name
          <input id="student-name" type="text" placeholder="e.g. Alex" />
        </label>
        <label>
          Class code
          <input id="class-code" type="text" placeholder="e.g. 3F2A9C" style="text-transform: uppercase" />
        </label>

        <div class="row">
          <button id="scan-btn" class="secondary">Scan LAN for teachers</button>
        </div>
        <ul id="found-list" class="found-list"></ul>

        <label>
          Teacher IP address
          <input id="teacher-host" type="text" placeholder="e.g. 192.168.1.20" />
        </label>
        <label>
          Port
          <input id="teacher-port" type="number" value="41235" />
        </label>

        <button id="connect-btn">Connect</button>
        <p id="connect-status" class="status-text"></p>
      </section>

      <section id="connected-panel" class="hidden">
        <p id="connected-status" class="status-text"></p>
        <button id="disconnect-btn" class="secondary">Disconnect</button>
      </section>

      <div id="monitoring-banner" class="monitoring-banner hidden">
        🔴 Your screen is currently being viewed by <span id="viewer-name"></span>.
        <button id="stop-share-btn" class="secondary small">Stop sharing</button>
      </div>

      <div id="consent-dialog" class="consent-dialog hidden">
        <div class="consent-box">
          <p><span id="consent-teacher-name"></span> wants to view your screen.</p>
          <div class="row">
            <button id="consent-allow-btn">Allow</button>
            <button id="consent-deny-btn" class="secondary">Deny</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
