<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EzMonitor Parent</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data:;"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>EzMonitor &mdash; Parent</h1>
      <div id="session-info" class="session-info">Starting session&hellip;</div>
    </header>
    <main id="child-grid" class="child-grid">
      <p id="empty-state" class="empty-state">
        Waiting for a child device to connect. Enter the family code and this computer's address shown above
        into the EzMonitor Child app once, on the device you want to monitor.
      </p>
    </main>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
