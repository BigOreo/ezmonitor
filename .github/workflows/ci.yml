name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: [self-hosted, linux, kidemonitor]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
