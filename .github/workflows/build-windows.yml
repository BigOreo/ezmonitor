name: Build Windows installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [parent, child]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build --workspace=@ezmonitor/shared

      - name: Build ${{ matrix.app }} installer
        run: npm run dist:win
        working-directory: apps/${{ matrix.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: ezmonitor-${{ matrix.app }}-windows
          path: apps/${{ matrix.app }}/release/*.exe
